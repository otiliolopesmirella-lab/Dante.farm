name: Build Dante Farm DigiIdle APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - run: gradle :app:assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dante-Farm-DigiIdle.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dante-Farm-DigiIdle.apk --title "Dante Farm DigiIdle (APK)" --notes "APK pronto para instalar."
